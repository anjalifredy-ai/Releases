<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemonStore</title>
<style>
  :root{
    --bg: #0b0b0d;
    --surface: #161619;
    --surface-hover: #1d1d21;
    --line: #26262b;
    --text: #f2f2f0;
    --muted: #8c8c93;
    --accent: #ff5a1f;
    --accent-dim: #7a2c0f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }

  header{
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(11,11,13,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap: 10px;
  }
  .brand-mark{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 800;
    font-size: 16px;
    color: #0b0b0d;
    flex-shrink:0;
  }
  h1{
    font-size: 22px;
    margin:0;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .tagline{
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .stats{
    margin-top: 14px;
    display:flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .stats b{ color: var(--text); }

  main{
    padding: 8px 14px 60px;
    max-width: 720px;
    margin: 0 auto;
  }

  .group-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 22px 8px 8px;
    font-weight: 600;
  }

  .app-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 12px 10px;
    border-radius: 14px;
    transition: background 0.15s ease;
  }
  .app-row:active{
    background: var(--surface-hover);
  }

  .icon{
    width: 52px;
    height: 52px;
    border-radius: 13px;
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 800;
    font-size: 18px;
    color: #0b0b0d;
  }

  .meta{
    flex: 1;
    min-width: 0;
  }
  .app-name{
    font-size: 15.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-sub{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
    display:flex;
    gap: 6px;
    align-items:center;
  }
  .dot{
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink:0;
  }

  .dl-btn{
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .dl-btn:active{
    transform: scale(0.94);
    background: var(--accent);
    color: #0b0b0d;
  }
  .dl-btn.done{
    color: #6adf8a;
    border-color: #234d33;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 11.5px;
    padding: 30px 20px 40px;
  }

  ::selection{ background: var(--accent-dim); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">R</div>
    <h1>RemonStore</h1>
  </div>
  <p class="tagline">Direct APK downloads. No detours.</p>
  <div class="stats">
    <span><b id="countInstalled">0</b> installed set</span>
    <span><b id="countUninstalled">0</b> uninstalled set</span>
    <span><b id="totalSize">0</b> total</span>
  </div>
</header>

<main id="app"></main>

<footer>RemonStore — personal APK library</footer>

<script>
// ---- App data ----
// Edit `url` for each app to your real GitHub Release asset link once uploaded.
// Until then it points to "#" and the button will show a friendly notice.
const RELEASE_BASE = "https://github.com/anjalifredy-ai/Releases/releases/download/Remo/";

const apps = [
  {
    name: "NetMirror",
    version: "3.0",
    size: "51.71 MB",
    group: "uninstalled",
    color: "#c0272d",
    letter: "N",
    url: RELEASE_BASE + "NetMirror.apk"
  },
  {
    name: "ShowCase",
    version: "4.7",
    size: "5.53 MB",
    group: "uninstalled",
    color: "#1f3a5f",
    letter: "S",
    url: RELEASE_BASE + "showcase-v4.7.apk"
  },
  {
    name: "Vencord",
    version: "1.0.6",
    size: "1.24 MB",
    group: "uninstalled",
    color: "#e6b8b0",
    letter: "V",
    url: RELEASE_BASE + "Vencord-v1.0.6.apk"
  },
  {
    name: "SlimSocial for Instagram",
    version: "1.0",
    size: "1.08 MB",
    group: "uninstalled",
    color: "#c2185b",
    letter: "S",
    url: RELEASE_BASE + "app-release.1.apk"
  },
  {
    name: "Materialbook",
    version: "1.0.0",
    size: "1.70 MB",
    group: "uninstalled",
    color: "#7d9bd4",
    letter: "n",
    url: RELEASE_BASE + "Materialbook_v1.0.0.apk"
  },
  {
    name: "Mirarr",
    version: "3.3.2",
    size: "69.91 MB",
    group: "installed",
    color: "#e0d4b0",
    letter: "M",
    url: RELEASE_BASE + "app-release.apk"
  },
  {
    name: "YouTube Pro",
    version: "3.98",
    size: "122 KB",
    group: "installed",
    color: "#d32f2f",
    letter: "Y",
    url: RELEASE_BASE + "YTPRO.apk"
  },
  {
    name: "Telegram X",
    version: "0.28.1.1771",
    size: "52.65 MB",
    group: "installed",
    color: "#2f4a5e",
    letter: "T",
    url: RELEASE_BASE + "Telegram-X-0.28.1.1771.apk"
  },
  {
    name: "RiMusic",
    version: "0.6.72.1",
    size: "18.58 MB",
    group: "installed",
    color: "#2e8b57",
    letter: "R",
    url: RELEASE_BASE + "app-foss-release.apk"
  },
  {
    name: "LitePipe",
    version: "1.2.1",
    size: "6.20 MB",
    group: "installed",
    color: "#8b1a1a",
    letter: "L",
    url: RELEASE_BASE + "LitePipev1.2.1-arm64-v8a.apk"
  }
];

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const groups = [
    { key: 'installed', label: 'Installed' },
    { key: 'uninstalled', label: 'Uninstalled' }
  ];

  let installedCount = 0, uninstalledCount = 0, totalMB = 0;

  groups.forEach(g => {
    const items = apps.filter(a => a.group === g.key);
    if(items.length === 0) return;

    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = g.label + ' (' + items.length + ')';
    app.appendChild(label);

    items.forEach(a => {
      if(g.key === 'installed') installedCount++; else uninstalledCount++;
      const mbMatch = a.size.match(/([\d.]+)\s*MB/);
      if(mbMatch) totalMB += parseFloat(mbMatch[1]);

      const row = document.createElement('div');
      row.className = 'app-row';
      row.innerHTML = `
        <div class="icon" style="background:${a.color}">${a.letter}</div>
        <div class="meta">
          <div class="app-name">${a.name}</div>
          <div class="app-sub">
            <span>${a.size}</span>
            <span class="dot"></span>
            <span>v${a.version}</span>
          </div>
        </div>
        <button class="dl-btn" data-name="${a.name}" data-url="${a.url}">Get</button>
      `;
      app.appendChild(row);
    });
  });

  document.getElementById('countInstalled').textContent = installedCount;
  document.getElementById('countUninstalled').textContent = uninstalledCount;
  document.getElementById('totalSize').textContent = totalMB.toFixed(1) + ' MB';

  document.querySelectorAll('.dl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.getAttribute('data-url');
      const name = btn.getAttribute('data-name');
      if(!url || url === '#'){
        btn.textContent = 'Soon';
        setTimeout(() => { btn.textContent = 'Get'; }, 1400);
        return;
      }
      // Trigger direct download (GitHub release assets serve with
      // Content-Disposition: attachment, so this downloads directly
      // rather than navigating away).
      window.location.href = url;

      btn.textContent = '✓';
      btn.classList.add('done');
      setTimeout(() => {
        btn.textContent = 'Get';
        btn.classList.remove('done');
      }, 2000);
    });
  });
}

render();
</script>

</body>
</html>
