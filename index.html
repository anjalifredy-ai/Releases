 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemonStore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">R</div>
    <h1>RemonStore</h1>
  </div>
  <p class="tagline">Direct APK downloads. No detours.</p>
  <div class="stats">
    <span><b id="countInstalled">0</b> installed set</span>
    <span><b id="countUninstalled">0</b> uninstalled set</span>
    <span><b id="countUploaded">0</b> community</span>
  </div>
  <div class="top-actions">
    <button class="upload-toggle" id="uploadToggle">+ Upload App</button>
  </div>
</header>

<main>
  <div class="upload-panel" id="uploadPanel">
    <h3>Publish an app</h3>
    <form id="uploadForm">
      <div class="field">
        <label>App name</label>
        <input type="text" id="appName" placeholder="e.g. My Cool App" required>
      </div>
      <div class="field">
        <label>Description (optional)</label>
        <textarea id="appDescription" placeholder="What does this app do?"></textarea>
      </div>
      <div class="field">
        <label>APK file</label>
        <input type="file" id="apkFile" accept=".apk" required>
      </div>
      <div class="field">
        <label>Screenshots (optional, up to 6)</label>
        <input type="file" id="screenshotFiles" accept="image/*" multiple>
        <div class="hint">Shown on the app's detail page.</div>
      </div>
      <div class="field">
        <label>Upload PIN</label>
        <input type="password" id="uploadPin" placeholder="Enter PIN" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Publish</button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label">
          <span id="progressStage">Uploading...</span>
          <span><b id="progressPercent">0</b>%</span>
        </div>
      </div>
      <div class="upload-msg" id="uploadMsg"></div>
    </form>
  </div>

  <div id="app"></div>
</main>

<footer>RemonStore — personal APK library</footer>

<!-- Detail page overlay -->
<div id="detailView">
  <div class="detail-topbar">
    <button class="back-btn" id="detailBack">&#8592;</button>
    <div class="detail-topbar-title" id="detailTopbarTitle"></div>
  </div>
  <div class="detail-hero">
    <div class="detail-icon" id="detailIcon"></div>
    <div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-sub" id="detailSub"></div>
    </div>
  </div>
  <div class="detail-actions">
    <a class="detail-get-btn" id="detailGetBtn" href="#" download>Get</a>
  </div>
  <div class="detail-stats-row">
    <div class="detail-stat">
      <div class="detail-stat-value" id="detailStatSize">-</div>
      <div class="detail-stat-label">Size</div>
    </div>
    <div class="detail-stat">
      <div class="detail-stat-value" id="detailStatVersion">-</div>
      <div class="detail-stat-label">Version</div>
    </div>
    <div class="detail-stat">
      <div class="detail-stat-value" id="detailStatType">-</div>
      <div class="detail-stat-label">Source</div>
    </div>
  </div>
  <div class="screenshots-row" id="screenshotsRow"></div>
  <div class="detail-section">
    <h4>About this app</h4>
    <div class="detail-desc" id="detailDesc"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
