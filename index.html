<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemonStore</title>
<style>
  :root{
    --bg: #0b0b0d;
    --surface: #161619;
    --surface-hover: #1d1d21;
    --line: #26262b;
    --text: #f2f2f0;
    --muted: #8c8c93;
    --accent: #ff5a1f;
    --accent-dim: #7a2c0f;
    --green: #6adf8a;
    --red: #ff5c5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    min-height:100vh;
  }

  header{
    padding: 28px 20px 16px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(11,11,13,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap: 10px;
  }
  .brand-mark{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 800;
    font-size: 16px;
    color: #0b0b0d;
    flex-shrink:0;
  }
  h1{
    font-size: 22px;
    margin:0;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .tagline{
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .stats{
    margin-top: 14px;
    display:flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .stats b{ color: var(--text); }

  .top-actions{
    margin-top: 16px;
    display:flex;
    gap: 10px;
  }
  .upload-toggle{
    flex: 1;
    background: var(--accent);
    color: #0b0b0d;
    border: none;
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .upload-toggle:active{ transform: scale(0.98); }

  main{
    padding: 8px 14px 60px;
    max-width: 720px;
    margin: 0 auto;
  }

  /* Upload panel */
  .upload-panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin: 16px 8px 8px;
    display: none;
  }
  .upload-panel.open{ display: block; }
  .upload-panel h3{
    margin: 0 0 14px;
    font-size: 16px;
  }
  .field{
    margin-bottom: 12px;
  }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input[type="text"],
  .field input[type="password"]{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14px;
  }
  .field input[type="file"]{
    width: 100%;
    color: var(--muted);
    font-size: 13px;
  }
  .submit-btn{
    width: 100%;
    background: var(--accent);
    color: #0b0b0d;
    border: none;
    padding: 13px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    margin-top: 4px;
  }
  .submit-btn:disabled{
    opacity: 0.5;
  }
  .upload-msg{
    margin-top: 10px;
    font-size: 13px;
    text-align: center;
  }
  .upload-msg.ok{ color: var(--green); }
  .upload-msg.err{ color: var(--red); }

  .group-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 22px 8px 8px;
    font-weight: 600;
  }

  .app-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 12px 10px;
    border-radius: 14px;
    transition: background 0.15s ease;
  }
  .app-row:active{
    background: var(--surface-hover);
  }

  .icon{
    width: 52px;
    height: 52px;
    border-radius: 13px;
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 800;
    font-size: 18px;
    color: #0b0b0d;
  }

  .meta{
    flex: 1;
    min-width: 0;
  }
  .app-name{
    font-size: 15.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-sub{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
    display:flex;
    gap: 6px;
    align-items:center;
  }
  .dot{
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink:0;
  }

  .dl-btn{
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display:inline-block;
  }
  .dl-btn:active{
    transform: scale(0.94);
    background: var(--accent);
    color: #0b0b0d;
  }

  .empty-note{
    text-align:center;
    color: var(--muted);
    font-size: 13px;
    padding: 30px 20px;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 11.5px;
    padding: 30px 20px 40px;
  }

  ::selection{ background: var(--accent-dim); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">R</div>
    <h1>RemonStore</h1>
  </div>
  <p class="tagline">Direct APK downloads. No detours.</p>
  <div class="stats">
    <span><b id="countInstalled">0</b> installed set</span>
    <span><b id="countUninstalled">0</b> uninstalled set</span>
    <span><b id="countUploaded">0</b> community</span>
  </div>
  <div class="top-actions">
    <button class="upload-toggle" id="uploadToggle">+ Upload App</button>
  </div>
</header>

<main>
  <div class="upload-panel" id="uploadPanel">
    <h3>Publish an app</h3>
    <form id="uploadForm">
      <div class="field">
        <label>App name</label>
        <input type="text" id="appName" placeholder="e.g. My Cool App" required>
      </div>
      <div class="field">
        <label>Version (optional)</label>
        <input type="text" id="appVersion" placeholder="e.g. 1.0.0">
      </div>
      <div class="field">
        <label>APK file</label>
        <input type="file" id="apkFile" accept=".apk" required>
      </div>
      <div class="field">
        <label>Upload PIN</label>
        <input type="password" id="uploadPin" placeholder="Enter PIN" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Publish</button>
      <div class="upload-msg" id="uploadMsg"></div>
    </form>
  </div>

  <div id="app"></div>
</main>

<footer>RemonStore — personal APK library</footer>

<script>
// ---- Pre-seeded apps (from GitHub Releases) ----
const RELEASE_BASE = "https://github.com/anjalifredy-ai/Releases/releases/download/Remo/";

const staticApps = [
  { name: "NetMirror", version: "3.0", size: "51.71 MB", group: "uninstalled", color: "#c0272d", letter: "N", url: RELEASE_BASE + "NetMirror.apk" },
  { name: "ShowCase", version: "4.7", size: "5.53 MB", group: "uninstalled", color: "#1f3a5f", letter: "S", url: RELEASE_BASE + "showcase-v4.7.apk" },
  { name: "Vencord", version: "1.0.6", size: "1.24 MB", group: "uninstalled", color: "#e6b8b0", letter: "V", url: RELEASE_BASE + "Vencord-v1.0.6.apk" },
  { name: "SlimSocial for Instagram", version: "1.0", size: "1.08 MB", group: "uninstalled", color: "#c2185b", letter: "S", url: RELEASE_BASE + "app-release.1.apk" },
  { name: "Materialbook", version: "1.0.0", size: "1.70 MB", group: "uninstalled", color: "#7d9bd4", letter: "n", url: RELEASE_BASE + "Materialbook_v1.0.0.apk" },
  { name: "Mirarr", version: "3.3.2", size: "69.91 MB", group: "installed", color: "#e0d4b0", letter: "M", url: RELEASE_BASE + "app-release.apk" },
  { name: "YouTube Pro", version: "3.98", size: "122 KB", group: "installed", color: "#d32f2f", letter: "Y", url: RELEASE_BASE + "YTPRO.apk" },
  { name: "Telegram X", version: "0.28.1.1771", size: "52.65 MB", group: "installed", color: "#2f4a5e", letter: "T", url: RELEASE_BASE + "Telegram-X-0.28.1.1771.apk" },
  { name: "RiMusic", version: "0.6.72.1", size: "18.58 MB", group: "installed", color: "#2e8b57", letter: "R", url: RELEASE_BASE + "app-foss-release.apk" },
  { name: "LitePipe", version: "1.2.1", size: "6.20 MB", group: "installed", color: "#8b1a1a", letter: "L", url: RELEASE_BASE + "LitePipev1.2.1-arm64-v8a.apk" }
];

const palette = ["#c0272d","#1f3a5f","#e6b8b0","#c2185b","#7d9bd4","#e0d4b0","#d32f2f","#2f4a5e","#2e8b57","#8b1a1a","#5e35b1","#00838f"];
function colorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return palette[Math.abs(hash) % palette.length];
}

let uploadedApps = [];

async function loadUploadedApps(){
  try{
    const r = await fetch('/api/apps');
    if(!r.ok) return [];
    const data = await r.json();
    return data.map(a => ({
      name: a.name,
      version: a.version || '1.0',
      size: a.size,
      group: 'community',
      color: colorFor(a.name),
      letter: a.name.trim()[0]?.toUpperCase() || 'A',
      url: a.url
    }));
  }catch(e){
    return [];
  }
}

function render(allApps){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const groups = [
    { key: 'installed', label: 'Installed' },
    { key: 'uninstalled', label: 'Uninstalled' },
    { key: 'community', label: 'Community Uploads' }
  ];

  let installedCount = 0, uninstalledCount = 0, uploadedCount = 0;

  groups.forEach(g => {
    const items = allApps.filter(a => a.group === g.key);
    if(items.length === 0) return;

    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = g.label + ' (' + items.length + ')';
    app.appendChild(label);

    items.forEach(a => {
      if(g.key === 'installed') installedCount++;
      else if(g.key === 'uninstalled') uninstalledCount++;
      else uploadedCount++;

      const row = document.createElement('div');
      row.className = 'app-row';
      row.innerHTML = `
        <div class="icon" style="background:${a.color}">${a.letter}</div>
        <div class="meta">
          <div class="app-name">${a.name}</div>
          <div class="app-sub">
            <span>${a.size}</span>
            <span class="dot"></span>
            <span>v${a.version}</span>
          </div>
        </div>
        <a class="dl-btn" href="${a.url}" download>Get</a>
      `;
      app.appendChild(row);
    });
  });

  document.getElementById('countInstalled').textContent = installedCount;
  document.getElementById('countUninstalled').textContent = uninstalledCount;
  document.getElementById('countUploaded').textContent = uploadedCount;

  if(allApps.length === 0){
    app.innerHTML = '<div class="empty-note">No apps yet. Be the first to publish one.</div>';
  }
}

async function refreshAll(){
  uploadedApps = await loadUploadedApps();
  render([...staticApps, ...uploadedApps]);
}

// ---- Upload panel toggle ----
document.getElementById('uploadToggle').addEventListener('click', () => {
  document.getElementById('uploadPanel').classList.toggle('open');
});

// ---- Upload form submit ----
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('appName').value.trim();
  const version = document.getElementById('appVersion').value.trim();
  const pin = document.getElementById('uploadPin').value;
  const fileInput = document.getElementById('apkFile');
  const file = fileInput.files[0];
  const msg = document.getElementById('uploadMsg');
  const submitBtn = document.getElementById('submitBtn');

  msg.textContent = '';
  msg.className = 'upload-msg';

  if(!file){
    msg.textContent = 'Please choose an APK file.';
    msg.classList.add('err');
    return;
  }
  if(!file.name.toLowerCase().endsWith('.apk')){
    msg.textContent = 'Only .apk files are allowed.';
    msg.classList.add('err');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading...';

  try{
    const formData = new FormData();
    formData.append('appName', name);
    formData.append('version', version);
    formData.append('pin', pin);
    formData.append('file', file);

    const res = await fetch('/api/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();

    if(!res.ok){
      msg.textContent = data.error || 'Upload failed.';
      msg.classList.add('err');
    } else {
      msg.textContent = 'Published! It now shows in the list below.';
      msg.classList.add('ok');
      document.getElementById('uploadForm').reset();
      await refreshAll();
    }
  } catch(err){
    msg.textContent = 'Something went wrong. Try again.';
    msg.classList.add('err');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Publish';
  }
});

refreshAll();
</script>

</body>
</html>
